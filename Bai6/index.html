<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bai 6</title>
    <style>
        p.nhom{
            color: red;
        }
        .khoi1{
            background-color:green
        }
        .khoi2{
            background-color:yellow;
            /* margin nếu có 1 giá trị tạo khoảng cách đều xung quanh nó */
            /* margin nếu có 2 giá trị thì 1 là trrn dưới, 2 là trái phải */
            /* margin nếu có 4 giá trị thì lần lượt trên phải dưới trái */
            margin :50px 200px 10px 100px;

            /* padding là kích cỡ của nó */
            padding: 50px;
        }
        .khoi3{
            background-color:red;
            /* margin auto là để tự động căn vào giữa màn hình */
            margin: auto;
            width: 36%;
        }
        .khoi4{
            background-color:grey;
            /* display khối 4 làm nền cho khối 5 và 6 */
            display:flex ;
        }
        .khoi5{
            background-color:orange;
            width:50%
        }
        .khoi6{
            background-color:blue;
            width:50%
        }
    </style>
</head>
<body>
    <h1 style="color:red">Trường Đại Học Mỏ Địa Chất</h1>
    <p class="nhom">Nhóm 03</p>
    <div class="khoi1">Khối 1</div>
    <div class="khoi2">Khối 2</div>
    <div class="khoi3">Khối 3</div>

    <div class="khoi4">
        <div class="khoi5">Khối 5</div>
        <div class="khoi6">Khối 6</div>
    </div>
</body>
</html>
