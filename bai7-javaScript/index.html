<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- internal Javascript -->
    <!-- script cùng file -->
    <script>
        // in ra màn hình
        document.writeln("Hello World! <br>"); //br trong dấu nghoặc

        //khai báo biến
        var ten = "Công Anh <br>";
        document.writeln(ten);

        ten="Anh<br>";
        document.writeln(ten);

        var namNay=2026;
        document.writeln(namNay);

        //phép toán
        var soThuNhat = 10;
        var soThuHai = 5;
        var ketQua = 0;
        
        //cộng
        document.writeln("<br>Kết quả số thứ 1 + số thứ 2 là: ");
        ketQua = soThuNhat + soThuHai;
        document.writeln(ketQua);
        //trừ
        document.writeln("<br>Kết quả số thứ 1 - số thứ 2 là: ");
        ketQua = soThuNhat - soThuHai;
        document.writeln(ketQua);
        //nhân
        document.writeln("<br>Kết quả số thứ 1 x số thứ 2 là: ");
        ketQua = soThuNhat * soThuHai;
        document.writeln(ketQua);
        //chia
        document.writeln("<br>Kết quả số thứ 1 : số thứ 2 là: ");
        ketQua = soThuNhat / soThuHai;
        document.writeln(ketQua);
        //chia lấy dư
        document.writeln("<br>Kết quả số thứ 1 % số thứ 2 là: ");
        ketQua = soThuNhat % soThuHai;
        document.writeln(ketQua);
        //++
        document.writeln("<br>")
        document.writeln(++soThuNhat);
        //--
        document.writeln("<br>")
        document.writeln(--soThuNhat);

        //+=
        soThuNhat+=soThuHai;
        document.writeln("<br>")
        document.writeln(soThuNhat);

        //-=
        soThuNhat-=soThuHai;
        document.writeln("<br>")
        document.writeln(soThuNhat);

        //nối chuỗi
        var ho="Nguyễn";
        document.writeln("<br>"+ho+" "+ten);
        document.writeln("<br>")

        //độ dài chuỗi
        document.writeln(ho.length);

        //kiểm tra kiểu dữ liệu của biến
        document.writeln(typeof(ho));

        //tìm kiếm trong chuỗi và báo vị trí 
        var hoVaTen="Nguyễn Vũ Công Anh";
        document.writeln("<br>");
        //-1 là không có, từ 0 trở đi là có vị trí
        document.writeln(hoVaTen.indexOf("Anh"));
        document.writeln("<br>");

        // true hoặc false
        document.writeln(hoVaTen.includes("u"));
        document.writeln("<br>");

        // ktra chữ bắt đầu trả về true hoặc false
        document.writeln(hoVaTen.startsWith("Nguyễn"));
        document.writeln("<br>");

        //thay thế
        document.writeln(hoVaTen.replace("Nguyễn","Vũ"));
        document.writeln("<br>");

        //viết hoa
        document.writeln(hoVaTen.toUpperCase());
        document.writeln("<br>");
        //viết thường
        document.writeln(hoVaTen.toLocaleLowerCase());
        document.writeln("<br>");


        // ngày 30/9
        
        // hàm date 
        var homNay = new Date();
        document.writeln("<br>");
        document.writeln(homNay);

        // ngày chọn trước
        var ngay = new Date("9/30/2025");
        document.writeln("<br>");
        document.writeln(ngay);

        // năm nay 
        var namNay = homNay.getFullYear();
        document.writeln("<br>");
        document.writeln(namNay);

        // tháng này (tháng bắt đầu từ 0 đến 11)
        var thangNay = homNay.getMonth()+1;
        document.writeln("<br>");
        document.writeln(thangNay);

        // getDate là ngày
        var ngayHomNay = homNay.getDate();
        document.writeln("<br>");
        document.writeln(ngayHomNay);

        // getDay là thứ bắt đầu từ 1 đến 7
        var thuHomNay = homNay.getDay()+1;
        document.writeln("<br>");
        document.writeln(thuHomNay);

        //
        document.writeln("<br>");
        document.writeln("Hôm nay là thứ "+ thuHomNay+" ngày "+ngayHomNay+" tháng "+ thangNay +" năm "+namNay);
        document.writeln("<br>");

        //mảng (vị trí bắt đầu từ 0)
        var mangSo = [1,2,3,4,5];
        document.writeln(mangSo[2]);
        document.writeln("<br>");
        document.writeln(mangSo.length);  //độ dài
        document.writeln("<br>");

        var mangTen=["Công Anh","Dung","Huy"];
        document.writeln(mangTen[0]);  //gọi phần tử
        document.writeln("<br>");

        var mang=[1,2,3,4,5,"Công Anh","Dung","Huy"];
        document.writeln(mang[5]);
        document.writeln("<br>");

        //conCat nối các mảng
        var d = mang.concat(mangSo,mangTen);
        document.writeln("<br>");
        document.writeln(d);
        document.writeln("<br>");
        document.writeln(d.join("-")); //sau khi các phần tử mảng liên kết bởi dấu "-" thì thành chuỗi
        document.writeln("<br>");
        
        // bỏ phần tử cuối cùng trong mảng
        document.writeln(d.pop());
        document.writeln("<br>");
        document.writeln(d);
        document.writeln("<br>");

        //thêm phần tử vào mảng
        d.push("Duy")
        document.writeln(d);
        document.writeln("<br>");

        //đảo thứ tự
        document.writeln(mangSo.reverse());
        document.writeln("<br>");

        //object
        var thongTinSinhVien = {
            ten: "Nguyen Vu Cong Anh",
            namSinh : 2006,
            queQuan: {
                tinh: "Thanh Hoa",
                xa: "Son Dien"
            }
        };
        document.writeln(thongTinSinhVien.ten);
        document.writeln("<br>");
        document.writeln(thongTinSinhVien.queQuan.tinh);
        //tính tuổi bằng thông tin trong object
        tuoi=namNay - thongTinSinhVien.namSinh;
        //thêm thông tinh vào object
        thongTinSinhVien.tuoi=tuoi;

        //console.log(thongTinSinhVien)  chỉ dùng để kiểm tra dữ liệu bằng console
        
        //boolean: true nam / false nữ
        thongTinSinhVien.gioiTinh = true;

        var danhSachSinhVien=[
            {
            ten: "Nguyen Vu Cong Anh",
            namSinh : 2006,
            queQuan: {
                tinh: "Thanh Hoa",
                xa: "Son Dien"
            }
        },
        {
            ten: "Nguyen Vu Cong Anh",
            namSinh : 2006,
            queQuan: {
                tinh: "Thanh Hoa",
                xa: "Son Dien"
            }
        }
        ];
        //console.log(sanhSachSinhVien);
    

        // == != > < so sánh trả về true false
        // nếu == thì chỉ quan tâm giá trị
        // nếu === phải cùng kiểu dữ liệu
        var so1=10
        var so2="10"
        document.writeln("<br>");
        document.writeln(so1 == so2);

        // document.writeln("<br>");
        // if(thu>6){
        //     document.writeln("Cuối tuần");
        // }else{
        //     document.writeln("Đi học");
        // };

        document.writeln("<br>");
        var so=200000000000000000000001;
        if(so%2==0){
            document.writeln(so+" là số chẵn")
        }else{
            document.writeln(so + " là số lẻ")
        }

        document.writeln("<br>");
        var so="200000000000000000000001";
        if("02468".includes(so[so.length-1])){    //kiểm tra số cuối có phải chẵn hay kh
            document.writeln(so+" là số chẵn")
        }else{
            document.writeln(so + " là số lẻ")
        }
        document.writeln("<br>");

        //
        //switch case
        var d = new Date();
        var theDay = d.getDay();
        switch (theDay){
            case 5:
                document.writeln("Finally Friday");
                break;
            case 6:
                document.writeln("Super Saturday");
                break;
            case 0:
                document.writeln("Sleepy Sunday");
                break;
            default:
                document.writeln("I'm looking forward to thí weekend");
        }

        document.writeln("<br>");
        // vòng lặp for
        for (var index =1; index <= 100; index++){
            document.writeln("<br>");
            document.writeln("anh xin lỗi lần thứ "+index);
        }
        
        //dùng mảng cũ trước đó
        for (var i=0;i<mang.length;i++){
            document.writeln("<br>");
            document.writeln(mang[i]);
        }

        for (var i=0;i<mang.length;i++){
            if (isNaN(mang[i])){   //isNaN kiểm tra kiểu dữ liệu có khác số: true & false
                document.writeln("<br>");
                document.writeln("Xin chào "+mang[i]);
            }
        }
        document.writeln("<br>");
        //while kiểm tra trước rồi làm
        var i=0;
        while (i<=10){
            document.writeln("The number is " +i);
            document.writeln("<br>");
            i=i+1;
        }
         
        // do while làm rồi mới kiểm tra
        var j =0;
        do {
            document.writeln("The number is "+j);
            document.writeln("<br>");
            j=j+1;
        }while(j<=10)

        //popup boxes (ô cảnh báo hiện lên trang)
        alert("Hello");
        var r = confirm("Press a button")
        if(r==true){     //nếu chọn ok
            document.writeln("You pressed OK!");
        }
        else{
            document.writeln("You pressed CANCEL!");
        }

        var r=prompt("Nhập họ tên", "Nhập tên ở đây");
        document.writeln(r);


        
    </script>
    <!-- External Javascript -->
    <!-- liên kết đến file script riêng -->
    <script src="script.js"></script>
</body>
</html>
