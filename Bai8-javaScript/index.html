<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //function  (hàm chỉ chạy khi được gọi tên hàm ra)
        //hàm không tham số
        function sayHello(){
            document.writeln("Hello");
        }
        sayHello();

        //hàm có tham số, có thể đổi tham số khi dùng
        function sayHello2(ten){
            document.writeln("<br>Xin chào bạn " +ten);
        }
        sayHello2("Công Anh");
        

        document.writeln("<br>");

        function tinhTong(a,b){
            if(isNaN(a)==false && isNaN(b)==false){
                document.writeln("Tổng 2 số = "+(a+b))
            }
        }
        var soThuNhat = prompt("Nhập số thứ 1 ","Nhập");
        var soThuHai = prompt("Nhập số thứ 2 ","Nhập");
        tinhTong(soThuNhat,soThuHai);
        document.writeln("<br>");


        //btvn
        //viết hàm tính điểm chữ dựa trên 3 điểm (ABC)
        //tong = A*0,6 + B*0,3 + C*0,1 => điểm chữ tương ứng
        function tinhDiem(a,b,c){
            if(isNaN(a)==false && isNaN(b)==false && isNaN(c)==false){
                if(a<0 || a>10 || b<0 || b>10 || c<0 || c>10){
                    document.writeln("Điểm phải từ 0-10");
                } else{
                diemHe10 = a*0.6 + b*0.3 + c*0.1;
                if (diemHe10 < 4) {
                    document.writeln("Điểm hệ chữ: F");
                } else if (diemHe10 < 5.5) {
                    document.writeln("Điểm hệ chữ: D");
                } else if (diemHe10 < 7) {
                    document.writeln("Điểm hệ chữ: C");
                } else if (diemHe10 < 8.5) {
                    document.writeln("Điểm hệ chữ: B");
                } else {
                    document.writeln("Điểm hệ chữ: A");
                }           
            }     
            }
        }
        var diemA = prompt("Nhập điểm A","0-10");
        var diemB = prompt("Nhập điểm B","0-10");
        var diemC = prompt("Nhập điểm C","0-10");
        tinhDiem(diemA,diemB,diemC);


    </script>
</body>
</html>
