<html>
    <head>
        <title>bai 1 html</title>
    </head>
    <body>
        Môn Phát triển ứng dụng web + btl
        <!--đây là chú thích-->
        <!-- cách 1(ctrl+k+c) -->
        <!-- cách 2(ctrl + /) -->
        <p>thẻ p là thẻ phân đoạn</p>
        <h1>thẻ H1</h1> <!-- thẻ h1 2 3 số càng nhỏ cỡ càng to -->
        <h2>thẻ H2</H2>
        <h3>thẻ H3</h3>
        <p>môn web <br> nhóm 03</p> <!--thẻ br xuống dòng-->
        <!-- thẻ div và span để phân chia đoạn -->
        <div> đây là div</div>
        <span>đây là span</span><br>
        <b> thẻ b </b><br>
        <strong> thẻ strong </strong><br>
        <i> thẻ i </i><br>
        <em> thẻ em</em><br>
        <u> thẻ u </u><br>
        <div>
            <font face="verdana">Môn Phát Triển Ứng Dụng WEB</font>
            <font color="blue">Nhóm 03</font>
            <font size="10">Tiết 1 2</font>
            <br><font face="arial" color="green" size="15">Nguyễn Vũ Công Anh</font>
        </div>
    </body>
</html>
